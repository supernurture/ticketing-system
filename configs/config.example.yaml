app:
  name: ticketing-system
  version: 1.0.0
  env: development # development, staging, or production; only production sends HSTS

server:
  mode: debug # test, debug, or release; release drops gin's route dump and startup warnings
  port: 8080
  timeout: 30s # deadline for a handler and everything it calls; the write timeout is this plus 5s
  cors_origins: [] # e.g. ["https://app.example.com"]; empty grants no browser origin, ["*"] rules out cookies
  trusted_proxies: [] # e.g. ["10.0.0.0/8"]; empty trusts only the direct peer for client IPs
  max_body_bytes: 1048576 # 1 MiB; 0 uses the middleware default

databases:
  postgres:
    ticketing:
      host: localhost
      port: 5432
      user: postgres
      password: postgres
      database: ticketing
      opts: sslmode=disable # sslmode=require in production
      max_open_conns: 25 # 0 means unlimited, which lets a traffic spike exhaust the database
      max_idle_conns: 5 # set far below max_open_conns and the pool reopens connections under load
      conn_max_lifetime: 30m # recycles connections, so a failover or rotated credential is picked up

logger:
  path: ./logs
  level: INFO # DEBUG, INFO, WARN, or ERROR
  rotation_pattern: daily # daily, or size-based via rotation_size_mb
  rotation_size_mb: 20 # only consulted when rotation_pattern is not daily
  retention_days: 1 # enough for local work; production usually wants weeks
  console: true # also print JSON logs to stderr
