openapi: 3.0.3
info:
  title: Auth API
  description: Exchanges an email and password for a JWT used by every other module.
  version: 1.0.0
tags:
  - name: auth
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Log in
      description: "Available to every user, customer or admin. Send the token as: Authorization: Bearer <token>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Email or password missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: admin@mkp.test
        password:
          type: string
          example: Admin123!
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - role
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until the token expires.
          example: 3600
        role:
          type: string
          enum: [admin, customer]
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: invalid email or password
